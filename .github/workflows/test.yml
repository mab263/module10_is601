name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  test:
    name: 1. Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test
    steps:
      - uses: actions/checkout@v4

env:
  IMAGE_NAME: fastapi-calculator

jobs:
  test:
    name: 1. Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run unit, integration, and e2e tests
        run: pytest --cov=. --cov-report=term-missing